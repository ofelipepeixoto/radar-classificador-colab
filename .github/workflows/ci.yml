name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test corpus, guardrails, widgets with CPU doubles and notebooks
        run: PYTHONPATH=ft05 python -B -m unittest discover -s ft05/tests -v
      - name: Check publication content
        run: python -B scripts/check_publication.py
